<form id="uploadForm">
  <!-- Video Input -->
  <label>Video:</label>
  <input type="file" id="video" accept="video/*" /><br/>

  <!-- NEW: Image Input -->
  <label>Poster/Image:</label>
  <input type="file" id="image" accept="image/*" /><br/>

  <input type="text" id="title" placeholder="Title" />
  <input type="text" id="description" placeholder="Description" />
  <button type="submit">Upload</button>
</form>

<script>
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const fd = new FormData();

  // 1. Append the Video
  const videoFile = document.getElementById("video").files[0];
  fd.append("media", videoFile);

  // 2. Append the Image (New)
  // Ensure the key string "poster" matches exactly what your Backend DTO expects
  const imageFile = document.getElementById("image").files[0];
  fd.append("poster", imageFile); 

  // 3. Append other data
  fd.append("Title", document.getElementById("title").value);
  fd.append("Description", document.getElementById("description").value);
  fd.append("PublishedDate", 16);
  fd.append("AgeGroup", 10);
  fd.append("ImdbRating", 8.6);
  fd.append("Languages", JSON.stringify(["sundanese"]));
  fd.append("Countries", JSON.stringify(["iran", "Iraq"]));
  fd.append("Actors", JSON.stringify(["Drama", "Thriller"])); // Note: These look like genres, but matching your code
  fd.append("Genres", JSON.stringify(["Drama", "Thriller"]));
  fd.append("Directors", JSON.stringify(["Christopher Nolan", "jim carry"]));

  await fetch("http://localhost:5030/api/video/movie", {
    method: "POST",
    body: fd
  });
});
</script>
