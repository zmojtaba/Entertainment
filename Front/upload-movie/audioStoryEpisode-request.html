


<audio controls
src="http://localhost:5030/media/story//podcast//asdf_5a3f02a9f2af4746a36c29eb05df3059//9443835d6f70409b928937d8780fbd82_01%20Halgheye%20Asheghy.mp3"></audio>

<form id="uploadForm">
  <!-- Video Input -->
  <label>Video:</label>
  <input type="file" id="audio" accept="video/*" /><br/>

  <input type="text" id="guid" placeholder="guid" />
  <input type="text" id="Title" placeholder="Title" />
  
  <button type="submit">Upload</button>
</form>

<script>
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const fd = new FormData();

  // 1. Append the Video
  const videoFile = document.getElementById("audio").files[0];
  fd.append("audio", videoFile);

  // 2. Append the Image (New)
  // Ensure the key string "poster" matches exactly what your Backend DTO expects
  // 3. Append other data
  fd.append("SeriesId", document.getElementById("guid").value);
  fd.append("Title", document.getElementById("Title").value);
// http://localhost:5030/api/video/series/season
  await fetch("http://localhost:5030/api/story/audio-story/episode", {
    method: "POST",
    body: fd
  });
});
</script>
